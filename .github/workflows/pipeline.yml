
#workflow name displayed in the GitHub Actions dashboard
name: Tourism Project Pipeline

#events that trigger this workflow
on:
  #run automatically whenever code is pushed to the main branch
  push:
    branches:
      - main

  #allow a user to manually start the workflow from the Actions tab
  workflow_dispatch:

#grants the workflow permission to push the trained model back to the repository
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Register Dataset
  # Downloads/registers the dataset and makes it available to later jobs
  # through a GitHub Actions artifact.
  # ---------------------------------------------------------------------------
  register-dataset:
    #friendly job name shown in the GitHub Actions interface
    name: Register Dataset

    #use the latest Ubuntu-hosted GitHub Actions runner
    runs-on: ubuntu-latest

    steps:
      #checks out the repository code so workflow scripts are available
      - name: Checkout repository
        uses: actions/checkout@v4

      #installs Python 3.11 on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #installs project libraries listed in the requirements file
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      #runs the Python script that obtains or registers the source dataset
      - name: Register dataset
        run: python tourism_project/model_building/data_register.py

      #stores the registered dataset as an artifact.
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------------------------------------------------------------------------
  # JOB 2: Data Preparation
  # Cleans/transforms data and creates training and test datasets.
  # ---------------------------------------------------------------------------
  data-preparation:
    name: Data Preparation

    #this job only starts after register-dataset completes successfully
    needs: register-dataset

    runs-on: ubuntu-latest

    steps:
      #retrieves repository code and workflow scripts
      - name: Checkout repository
        uses: actions/checkout@v4

      #configures the required Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #installs the Python packages required by prep.py
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      # Runs data cleaning, feature preparation, and train/test splitting.
      - name: Prepare data
        run: python tourism_project/model_building/prep.py

      # Saves output split files so the model-training job can retrieve them
      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------------------------------------------------------------------------
  # JOB 3: Model Training and MLflow Experiment Tracking
  # Downloads prepared data, runs model training, tracks experiments in MLflow,
  # and commits the selected model artifact back to the repository.
  # ---------------------------------------------------------------------------
  model-training:
    name: Model Training

    #this job runs only after data preparation completes successfully
    needs: data-preparation

    runs-on: ubuntu-latest

    steps:
      #retrieves repository code, including train.py and deployment folders
      - name: Checkout repository
        uses: actions/checkout@v4

      #sets up the Python interpreter used for model training
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #installs MLflow, scikit-learn, and other project dependencies
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt

      # Downloads the data-splits artifact created in the data-preparation job.
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      # Starts a local MLflow tracking UI/server in the background.
      # `nohup` prevents the process from stopping when the shell command ends.
      # The five-second pause allows MLflow time to initialize before train.py runs.
      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      #trains the machine-failure model and records metrics/artifacts in MLflow
      - name: Train model with MLflow tracking
        run: python tourism_project/model_building/train.py

      #configures Git identity, stages the generated model, and pushes it to main.
      # `[skip ci]` prevents the model commit from repeatedly triggering this workflow.
      # `|| echo` prevents failure if no new model file changes were produced.
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
